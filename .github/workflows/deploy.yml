# Пуш в main → проверки → Docker-образ в GitHub Container Registry → выкладка на сервер.
# Выкладка включается, когда в Settings → Secrets and variables → Actions → Variables
# задан DEPLOY_HOST (IP сервера). Без него workflow только проверяет и собирает образ.
#
# Variables:  DEPLOY_HOST  — IP сервера
#             DOMAIN       — домен (необязательно; по умолчанию <ip>.sslip.io)
#             DEPLOY_MODE  — shared: временно на чужом сервере рядом с другим сайтом,
#                            только приложение на http://<ip>:8080, без своего Caddy
#                            (deploy/docker-compose.shared.yml). По умолчанию — свой
#                            сервер с Caddy и HTTPS (deploy/docker-compose.yml).
# Secrets:    SSH_KEY         — приватный ключ пользователя deploy
#             SSH_KNOWN_HOSTS — отпечаток сервера (ssh-keyscan <ip>); без него
#                               отпечаток снимается при первом подключении
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # В .npmrc прописано зеркало для российских сетей; раннеру GitHub оно не нужно.
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sed -i 's#^registry=.*#registry=https://registry.npmjs.org#' .npmrc
      - name: Имя образа в нижнем регистре
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      MODE: ${{ vars.DEPLOY_MODE }}
    steps:
      - uses: actions/checkout@v5

      - name: Имя образа в нижнем регистре
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: SSH-доступ
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS не задан — отпечаток сервера снят при подключении"
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Конфиг сервера
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          umask 077
          domain="${DOMAIN:-${HOST//./-}.sslip.io}"
          if [ "$MODE" = "shared" ]; then
            echo "SITE=http://$HOST:8080" >> "$GITHUB_ENV"
            echo "DIR=prompower-academy" >> "$GITHUB_ENV"
            cp deploy/docker-compose.shared.yml deploy/compose.yml
          else
            echo "SITE=https://$domain" >> "$GITHUB_ENV"
            echo "DIR=/opt/prompower-academy" >> "$GITHUB_ENV"
            cp deploy/docker-compose.yml deploy/compose.yml
          fi
          {
            echo "DOMAIN=$domain"
            echo "IMAGE=$IMAGE"
            echo "IMAGE_TAG=${{ github.sha }}"
            echo "TZ=Europe/Moscow"
          } > deploy/.env

      - name: Выкладка
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh deploy@"$HOST" "mkdir -p $DIR"
          scp deploy/compose.yml deploy/Caddyfile deploy/.env deploy@"$HOST":"$DIR"/
          printf '%s' "$GHCR_TOKEN" | ssh deploy@"$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh deploy@"$HOST" "cd $DIR && chmod 600 .env && docker compose -f compose.yml pull -q && docker compose -f compose.yml up -d --remove-orphans && docker image prune -f"

      - name: Проверка
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$SITE/api/health"; then echo; echo "$SITE работает"; exit 0; fi
            sleep 5
          done
          ssh deploy@"$HOST" "cd $DIR && docker compose -f compose.yml ps && docker compose -f compose.yml logs --tail=50"
          exit 1
